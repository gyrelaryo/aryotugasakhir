<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-container">

    <div class="login-card">

        <h1>Web Aryo</h1>

        <p>Silakan Login</p>

        <form id="loginForm">

            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <button
            class="signup-btn"
            onclick="window.location.href='register.html'"
        >
            Sign Up
        </button>

    </div>

</div>

<script src="login.js"></script>

</body>
</html>
